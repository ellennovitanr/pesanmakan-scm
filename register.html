<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - PesanMakan</title>
</head>
<body>

    <h1>Register PesanMakan</h1>

    <form>
        <label>Nama Lengkap</label><br>
        <input type="text" placeholder="Masukkan Nama"><br><br>

        <label>Email</label><br>
        <input type="email" placeholder="Masukkan Email"><br><br>

        <label>Password</label><br>
        <input type="password" placeholder="Masukkan Password"><br><br>

        <label>Konfirmasi Password</label><br>
        <input type="password" placeholder="Konfirmasi Password"><br><br>

        <button type="submit">Daftar</button>
    </form>

</body>
</html>
